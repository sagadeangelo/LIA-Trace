
# ============================================
# LIA TRACE - DOCKER COMPOSE
# Development environment
# ============================================

services:

  db:
    image: postgres:16-alpine
    container_name: lia_trace_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lia_trace}
      POSTGRES_USER: ${POSTGRES_USER:-lia_trace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "192.168.1.65:8000:8000"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: lia_trace_backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lia_trace}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-lia_trace}

    ports:
      - "192.168.1.65:8000:8000"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
